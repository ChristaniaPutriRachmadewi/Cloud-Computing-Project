
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ticketing-backend:v1
    container_name: ticketing-backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ticketing-frontend:v1
    container_name: ticketing-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
